name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg (macOS)
        run: |
          mkdir -p ffmpeg
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d ffmpeg/
          chmod +x ffmpeg/ffmpeg

      - name: Download yt-dlp (macOS)
        run: |
          mkdir -p yt-dlp
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o yt-dlp/yt-dlp
          chmod +x yt-dlp/yt-dlp

      - name: Build macOS app
        run: pyinstaller Spotify2MP3-macOS.spec --noconfirm

      - name: Zip macOS app
        run: |
          cd dist
          zip -r ../Spotify2MP3-macOS.zip Spotify2MP3.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify2MP3-macOS
          path: Spotify2MP3-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-win.zip
          Expand-Archive ffmpeg-win.zip -DestinationPath ffmpeg-win-tmp
          $exe = Get-ChildItem -Recurse ffmpeg-win-tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg\ffmpeg.exe

      - name: Download yt-dlp (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path yt-dlp
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile yt-dlp\yt-dlp.exe

      - name: Build Windows exe
        run: pyinstaller Spotify2MP3-Windows.spec --noconfirm

      - name: Zip Windows exe
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Spotify2MP3.exe -DestinationPath Spotify2MP3-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify2MP3-Windows
          path: Spotify2MP3-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Spotify2MP3-macOS/Spotify2MP3-macOS.zip
            Spotify2MP3-Windows/Spotify2MP3-Windows.zip
          generate_release_notes: true
